name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none
      - name: Syntax check the plugin
        run: find wordpress-plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Account checks (tokens, sessions, reset)
        run: php tests/php/run-tests.php

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Account unit tests (merge, adopt, detach, flows on the mock server)
        run: node --test tests/js/
