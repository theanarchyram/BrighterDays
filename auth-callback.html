<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Signing in</title>
<style>body{margin:0;background:#1a1410;color:#f4e8cc;font:18px Georgia,serif;display:flex;align-items:center;justify-content:center;min-height:100vh}</style>
</head>
<body>
<p>Signing you in. This window will close by itself.</p>
<script>
(function () {
  var msg = { bdAuth: 1, hash: location.hash };
  try { history.replaceState(null, '', location.pathname); } catch (e) {}
  try { if (window.opener) window.opener.postMessage(msg, location.origin); } catch (e) {}
  try { if (window.BroadcastChannel) { var bc = new BroadcastChannel('bd_auth'); bc.postMessage(msg); bc.close(); } } catch (e) {}
  setTimeout(function () { window.close(); }, 300);
})();
</script>
</body>
</html>
