<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Brighter Days</title>
<meta name="author" content="LeverOne Studios">
<meta name="description" content="Brighter Days by LeverOne Studios: a pixel-art shopkeeper game from candlelight to neon. Haggle, catch thieves, salvage scrap, forge masterworks and survive the ages.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="LeverOne Studios">
<meta property="og:title" content="Brighter Days">
<meta property="og:description" content="A shopkeeper's tale, from candlelight to neon. A LeverOne Studios game.">
<meta property="og:url" content="https://theanarchyram.github.io/BrighterDays/">
<meta property="og:image" content="https://theanarchyram.github.io/BrighterDays/images/brighter-days-ad-1200x630.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://theanarchyram.github.io/BrighterDays/images/brighter-days-ad-1200x630.png">
<meta name="theme-color" content="#120a06">
<link rel="icon" type="image/png" href="images/icon-512.png">
<link rel="apple-touch-icon" href="images/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a0f0a; --wood:#4a2c17; --wood2:#331d0f; --wood3:#6b4024; --woodhi:#8a5a32;
  --parch:#ecd7a8; --parch2:#cfae74; --parchhi:#f8ebc9; --ink:#2a1a10; --ink2:#5e4026;
  --gold:#f2c14e; --red:#9a2e24; --green:#4a7a2c; --green2:#3a5f22; --blue:#3d5a7a;
  --text:#f4e4c1; --muted:#c9ab72; --shadow:#0d0704;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#120a06; --shadow:#060302; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#120a06; --shadow:#060302; color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'VT323',ui-monospace,Menlo,Consolas,monospace;font-synthesis:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood2)}
img{image-rendering:pixelated}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  background:repeating-linear-gradient(0deg,var(--wood2) 0 2px,var(--wood) 2px 26px);}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--wood2);border-bottom:3px solid var(--shadow)}
.title{font-weight:400;color:var(--gold);font-size:19px;text-shadow:2px 2px 0 var(--shadow);line-height:1.1}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.chip{font-size:14px;padding:0 5px;border:2px solid var(--shadow);background:var(--wood3);color:var(--text)}
.chip.sick{background:var(--red)} .chip.guard{background:var(--blue)}
.purse{display:flex;align-items:center;gap:6px;background:var(--parch);color:var(--ink);padding:3px 8px;border:3px solid var(--shadow);font-weight:400;font-size:22px;box-shadow:inset -2px -2px 0 var(--parch2)}
.purse img{width:18px;height:18px}
.purse.neg{color:var(--red)}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.view{display:none;flex-direction:column;gap:10px;padding:12px 10px 16px}
.view.active{display:flex}
.frame{position:relative;margin:4px 6px 0;border:6px solid var(--wood3);outline:3px solid var(--shadow);box-shadow:inset 0 0 0 3px var(--shadow),0 5px 0 var(--shadow);background:#000;height:min(38vh,calc((min(100vw,480px) - 44px)*.7))}
.frame canvas{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
.lantern{position:absolute;top:-10px;width:22px;height:30px;animation:flick 1.4s infinite steps(2);z-index:2}
.lantern.l{left:-16px}.lantern.r{right:-16px}
@keyframes flick{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 6px #f6a640)}}
@media (prefers-reduced-motion: reduce){.lantern{animation:none}}
.bubble{position:absolute;right:8px;top:8px;max-width:62%;background:var(--parch);color:var(--ink);border:3px solid var(--shadow);padding:6px 8px;font-size:18px;line-height:1.22;box-shadow:3px 3px 0 rgba(0,0,0,.45);transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:14px;bottom:-9px;width:10px;height:10px;background:var(--parch);border-right:3px solid var(--shadow);border-bottom:3px solid var(--shadow);transform:rotate(45deg)}
.bubble.hide{opacity:0}
.who{position:absolute;left:6px;top:6px;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;background:rgba(20,10,5,.78);padding:1px 6px;border:2px solid var(--shadow);color:var(--text)}
.who:empty{display:none}
.pips{position:absolute;right:6px;bottom:8px;display:flex;gap:3px}
.pip{width:10px;height:10px;background:#d9443a;border:2px solid var(--shadow)}
.pip.off{background:#3a2a20}
.parch{background:var(--parch);color:var(--ink);border:3px solid var(--shadow);box-shadow:inset 3px 3px 0 var(--parchhi),inset -3px -3px 0 var(--parch2),0 3px 0 var(--shadow);padding:8px 10px}
.itemcard{display:flex;align-items:center;gap:10px;position:relative;padding-top:14px!important}
.itemcard>div{flex:1;min-width:0}
.itemcard #btnBite{margin-left:auto}
.itemcard img{width:40px;height:40px;flex:none}
.nm{font-weight:400;font-size:22px;line-height:1.1}
.mk{font-size:17px;color:var(--ink2)}
.tag{position:absolute;top:-11px;left:12px;font-size:15px;padding:0 7px;border:2px solid var(--ink);font-weight:400;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.tag.buy{background:#c6dba4}.tag.sell{background:#f0c49a}
.offerrow{display:flex;gap:8px}
.offerbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--wood2);border:3px solid var(--shadow);color:var(--parch);padding:4px;font-size:17px}
.offerbox b{color:var(--gold);font-size:31px;line-height:1}
.tray{flex:1.25;background:var(--wood3);border:3px solid var(--shadow);box-shadow:inset 0 4px 0 rgba(0,0,0,.35);padding:2px;position:relative;font:inherit;color:var(--muted)}
.tray canvas{width:100%;height:44px;display:block;image-rendering:pixelated}
.tray small{position:absolute;right:4px;top:1px;font-size:13px}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.coinbtn{background:none;border:0;color:var(--text);font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;cursor:pointer}
.coinbtn img{width:46px;height:38px;object-fit:contain;transition:transform .06s}
.coinbtn:active img{transform:translateY(3px) scale(.94)}
.coinbtn span{font-size:17px;background:var(--wood2);border:2px solid var(--shadow);padding:1px 4px;width:100%;text-align:center}
.coinbtn:disabled{opacity:.45}
.btn{font:inherit;font-weight:400;font-size:20px;color:var(--text);background:var(--wood3);border:3px solid var(--shadow);box-shadow:inset 2px 2px 0 rgba(255,255,255,.18),inset -2px -2px 0 rgba(0,0,0,.3),0 3px 0 var(--shadow);padding:10px 6px;text-shadow:1px 1px 0 var(--shadow);cursor:pointer;line-height:1.1}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 2px 2px 0 rgba(255,255,255,.18),inset -2px -2px 0 rgba(0,0,0,.3),0 1px 0 var(--shadow)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}.btn.gold{background:#a87a26}.btn.blue{background:var(--blue)}
.btn:disabled{opacity:.45}
.btn.sm{font-size:17px;padding:6px 8px;flex:none}
.btn:focus-visible,.coinbtn:focus-visible,.tray:focus-visible,.tabs button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.actions{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}
.closed{text-align:center;display:flex;flex-direction:column;gap:8px}
.closed p{margin:0;font-size:19px;line-height:1.3}
.sign{align-self:center;background:var(--wood3);border:3px solid var(--shadow);padding:4px 16px;color:var(--gold);font-size:26px;font-weight:400;text-shadow:2px 2px 0 var(--shadow);box-shadow:0 3px 0 var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{background:var(--wood2);border:3px solid var(--shadow);padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;box-shadow:inset 0 0 0 2px var(--wood3)}
.slot img{width:46px;height:46px}
.slot .cnt{position:absolute;top:3px;right:3px;font-size:15px;background:var(--shadow);padding:0 4px;color:var(--parch)}
.slot .lab{background:var(--parch);color:var(--ink);border:2px solid var(--shadow);width:100%;text-align:center;font-size:15px;padding:2px;line-height:1.15}
.slot.empty img{opacity:.28}
.up{color:#2c6a15}.down{color:#9a2e24}
.big{display:flex;align-items:center;gap:12px}
.big img{width:44px;height:36px}
.big b{font-size:28px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:2px dashed var(--parch2)}
.row:last-child{border-bottom:0}
.row img{width:30px;height:30px;flex:none}
.grow{flex:1;font-size:19px;line-height:1.15}
.grow small{display:block;color:var(--ink2);font-size:15px}
h3{margin:0 0 4px;font-size:20px}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding:4px 2px 0;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.bar{flex:1;max-width:44px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:14px}
.bar i{display:block;width:100%;background:var(--green2);border:2px solid var(--ink);min-height:3px}
.bar i.neg{background:var(--red)}
.xl{display:flex;gap:6px;font-size:14px;padding:2px 2px 0 4px}.xl span{flex:1;max-width:44px;text-align:center}
.log{font-size:17px;line-height:1.3;margin:0;padding-left:16px}
.amt{font-weight:400;color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(5,2,1,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal.on{display:flex}
.modal .parch{max-width:420px;width:100%;max-height:82vh;overflow:auto}
.modal h2{margin:0 0 6px;font-size:28px;text-align:center}
.modal p{margin:6px 0;font-size:19px;line-height:1.3}
.mbtns{display:flex;gap:8px;margin-top:12px}.mbtns .btn{flex:1}
.thief{position:absolute;inset:0;z-index:20;display:none;background:radial-gradient(circle,rgba(150,25,12,.4),rgba(50,0,0,.9))}
.thief.on{display:block}
.thief h1{position:absolute;top:12%;left:0;right:0;text-align:center;margin:0;font-size:77px;color:#e2402c;text-shadow:4px 4px 0 #2a0805,-2px -2px 0 #f6c9a0;animation:shake .18s infinite}
.thief p{position:absolute;top:calc(12% + 72px);left:0;right:0;text-align:center;font-size:20px;margin:0}
@keyframes shake{0%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}100%{transform:translate(-2px,1px)}}
.grab{position:absolute;width:170px;transform:translate(-50%,-50%);font-size:23px;padding:14px 8px}
.tbar{position:absolute;left:20px;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px));height:20px;border:3px solid var(--shadow);background:#2a0805}
.tbar i{display:block;height:100%;width:100%;background:#e2402c}
.float{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-size:38px;font-weight:400;pointer-events:none;z-index:60;text-shadow:3px 3px 0 var(--shadow);animation:rise 1.2s forwards;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-70px)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--parch);color:var(--ink);border:3px solid var(--shadow);padding:6px 12px;font-size:18px;z-index:60;animation:fade 2.2s forwards;max-width:90vw;text-align:center}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
.hbtn{font:inherit;font-size:17px;color:var(--text);background:var(--wood3);border:2px solid var(--shadow);padding:4px 7px;cursor:pointer;box-shadow:0 2px 0 var(--shadow)}
.hbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field{display:block;width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--parchhi);border:3px solid var(--shadow);padding:6px;margin:4px 0 10px;-webkit-user-select:text;user-select:text;border-radius:0}
textarea.field{min-height:110px;resize:vertical}
.modal label{font-size:18px;display:block}
.chk{display:flex!important;gap:8px;align-items:center}
.chk input{width:20px;height:20px;flex:none}
.rep{border-bottom:2px dashed var(--parch2);padding:8px 0;font-size:18px;line-height:1.3}
.rep:last-child{border-bottom:0}
.tag.order{background:#c9d4f0}
.itemcard .btn.sm{padding:5px 6px;font-size:15px}
.rotate{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--wood2);text-align:center;padding:24px;font-size:23px}
.rotate.on{display:flex}
.rotate .ico{width:84px;height:116px;border:6px solid var(--parch);background:var(--wood3);box-shadow:0 4px 0 var(--shadow);animation:turn 2.4s infinite}
@keyframes turn{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion: reduce){.rotate .ico{animation:none;transform:rotate(-90deg)}}
@media (min-width:600px) and (orientation:landscape){
 #app{max-width:1240px}
 .hud{padding:10px 20px}.title{font-size:26px}.chip{font-size:17px}
 #v-shop.active{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,1fr);gap:16px 22px;align-items:start;padding:18px 20px}
 #v-shop .frame{grid-column:1;grid-row:1;justify-self:center;aspect-ratio:160/112;width:auto;margin:8px;
  height:min(calc(100vh - 290px),calc((min(100vw,1240px) - 90px)*.56*.7));height:min(calc(100dvh - 290px),calc((min(100vw,1240px) - 90px)*.56*.7))}
 #trade,#closed{grid-column:2;grid-row:1 / span 2}
 .floor{grid-column:1;grid-row:2}
 .poster{max-width:160px}.poster img{width:58px;height:58px}
 .bubble{font-size:23px;padding:8px 10px}.who{font-size:19px}
 .grid{grid-template-columns:repeat(5,1fr)}
 #v-stock.active{padding:18px 20px}
 #v-work.active,#v-town.active,#v-ledger.active{display:grid;grid-template-columns:1fr 1fr;align-items:start;padding:18px 20px}
 #v-work .sign,#v-town .sign,#v-ledger .sign{grid-column:1 / -1;justify-self:center}
 .yard{grid-template-columns:repeat(6,1fr)}.pile{font-size:17px}
 .tabs{justify-content:center}.tabs button{max-width:170px;font-size:18px}
 .thief h1{font-size:123px}
 #trade{gap:14px!important}
 .parch{padding:12px 14px}.nm{font-size:28px}.mk{font-size:20px}.itemcard img{width:58px;height:58px}.tag{font-size:18px}
 .itemcard .btn.sm{font-size:19px;padding:7px 9px}
 .offerbox{font-size:20px}.offerbox b{font-size:44px}.tray canvas{height:66px}.tray small{font-size:15px}
 .coinbtn img{width:68px;height:56px}.coinbtn span{font-size:19px;padding:3px 4px}
 .btn{font-size:26px;padding:14px 8px}.btn.sm{font-size:19px;padding:8px 10px}
 .tabs button img{width:32px;height:32px}
 .grow{font-size:22px}.grow small{font-size:18px}.row img{width:36px;height:36px}
 .slot img{width:60px;height:60px}.slot .lab{font-size:18px}
}
.yard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pile{aspect-ratio:1;background:#6b5a46;border:3px solid var(--shadow);box-shadow:inset 0 -4px 0 rgba(0,0,0,.3),0 3px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;font:inherit;font-size:14px;color:var(--parch);cursor:pointer;line-height:1.1;text-align:center}
.pile img{width:62%;height:auto}
.pile.dug{background:#3d3226;box-shadow:inset 0 4px 0 rgba(0,0,0,.4);cursor:default}
.pile:disabled:not(.dug){opacity:.5}
.need{font-size:15px}.need .no{color:var(--red);font-weight:400}.need .ok{color:#2c6a15;font-weight:400}
.tabs{display:flex;background:var(--wood2);border-top:3px solid var(--shadow);padding:5px 6px}
.tabs button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer}
.tabs button img{width:26px;height:26px;opacity:.55}
.tabs button.on{color:var(--gold)}.tabs button.on img{opacity:1}
/* exchange */
.nyse{background:#030604;border:3px solid #000;box-shadow:0 0 0 2px #3a3a3a,0 8px 18px rgba(0,0,0,.6),inset 0 0 50px rgba(0,255,90,.05);color:#ffb000;padding:0 0 8px;overflow:hidden}
.tape{overflow:hidden;white-space:nowrap;background:#000;border-bottom:2px solid #1d1d1d;padding:5px 0}
.tapein{display:inline-block;animation:tape 45s linear infinite;font-size:22px;text-shadow:0 0 6px currentColor}
.tapein span{margin-right:30px}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tapein{animation:none}}
.up2{color:#3dff73}.dn2{color:#ff4a3d}.fl2{color:#c8c8c8}
.nyhead{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:8px 10px 4px;border-bottom:1px solid #222}
.nyhead .big{font-size:40px;color:#fff;letter-spacing:4px;line-height:1;text-shadow:0 0 8px rgba(255,255,255,.4)}
.nyhead small{display:block;color:#9a9a9a;font-size:17px}
.nyhead .clk{color:#7fd8ff;font-size:20px;text-align:right;text-shadow:0 0 6px currentColor}
.idx{display:flex;flex-wrap:wrap;gap:2px 18px;padding:6px 10px;font-size:20px;color:#d8d8d8;border-bottom:1px solid #222}
.idx b{text-shadow:0 0 6px currentColor}
.nyscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.nyt{border-collapse:collapse;width:100%;min-width:980px;font-size:20px}
.nyt th{background:#0d1a10;padding:0;border-bottom:2px solid #2a4a30;white-space:nowrap}
.nyt th button{all:unset;display:block;width:100%;box-sizing:border-box;padding:7px 8px;color:#7fd8ff;text-align:right;cursor:pointer;font:inherit}
.nyt th.l button{text-align:left}
.nyt th.on{background:#163020}.nyt th.on button{color:#fff}
.nyt th button:focus-visible{outline:2px solid #ffb000;outline-offset:-2px}
.nyt td{padding:5px 8px;text-align:right;border-bottom:1px solid #141a16;white-space:nowrap;text-shadow:0 0 5px currentColor;background:#030604}
.nyt td.l{text-align:left}
.nyt tr:nth-child(even) td{background:#07100a}
.nyt tr.me td{background:#2a2000}
.nyt td.tk{color:#fff;letter-spacing:1px}
.nyt th:nth-child(2),.nyt td:nth-child(2){position:sticky;left:0;z-index:1}
.nyfoot{padding:8px 10px 0;color:#c8c8c8;font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.nymsg{padding:18px 10px;color:#c8c8c8;font-size:20px;text-align:center}
.mechip{font:inherit;cursor:pointer;color:var(--gold)!important}
/* wanted posters */
.wall{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:2px 0}
.wall:empty{display:none}
.poster{position:relative;display:flex;align-items:center;gap:6px;max-width:150px;white-space:nowrap;background:linear-gradient(180deg,#f6e7c0,#d6ba84);border:2px solid #5a3a1a;box-shadow:2px 3px 0 rgba(0,0,0,.45),inset 0 0 10px rgba(120,70,20,.3);padding:9px 7px 5px;font:inherit;color:#3a1a0a;cursor:pointer;text-align:left}
.poster:nth-child(odd){transform:rotate(-2.5deg)}.poster:nth-child(even){transform:rotate(2deg)}
.poster::before{content:"";position:absolute;top:2px;left:50%;width:8px;height:8px;margin-left:-4px;background:radial-gradient(circle at 35% 35%,#ff9a8a,#a0201a);border-radius:50%;box-shadow:1px 1px 0 rgba(0,0,0,.45)}
.poster img{width:46px;height:46px;border:2px solid #5a3a1a;background:#cdb28a;flex:none}
.poster b{display:block;font-size:18px;color:#8a1f16;line-height:1;letter-spacing:1px}
.poster span{display:block;font-size:15px;line-height:1.05}
.poster:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bigposter{display:flex;gap:12px;align-items:flex-start}

 if(rr<(S.cat?.05:.25)){const t=['bread','cheese'].filter(k=>S.stock[k]>0);if(t.length){const k=pick(t),n=Math.min(S.stock[k],ri(1,3));S.stock[k]-=n;ev.push(['Rats ate '+n+' '+ITEMS[k].name,null]);}}
 else if(S.cat&&rr<.35)ev.push(['Your cat caught a rat. Good cat.',null]);
 S.orders=S.orders.filter(o=>{if(S.day>=o.due){repAdj(o.royal?-12:-6);ev.push(['Missed the order for '+o.by+'. Reputation falls.',null]);return false;}return true;});
 const bills=billsFor(),total=bills.reduce((a,b)=>a+b.a,0);
 S.purse-=total;

 const net=S.today.income-S.today.spent-total-S.today.fake;

 let o=offer;const g=Math.min(55,Math.floor(o/20));o%=20;const s=Math.floor(o/5);const cp=o%5;const cols=[];

 push(g,GOLDP);push(s,SILVP);push(cp,COPP);

const BOOKS={
 medical:{title:'Household Medical Guide',color:'#8a1f16',sub:'Symptoms, treatments and first aid',
  intro:WARN('General health and first-aid information only, not a substitute for a doctor. <b>In an emergency, call 911</b> or your local emergency number. US Poison Control: 1-800-222-1222. Mental health crisis: call or text 988.'),
  topics:[
  ['When to call 911',`<p>Call emergency services right away for:</p><ul><li>Chest pain or pressure, or pain spreading to the arm, jaw or back</li><li>Trouble breathing, or blue lips</li><li>Signs of stroke (see the BE FAST page)</li><li>Severe bleeding that won't stop</li><li>Someone who is unresponsive, or a seizure lasting over 5 minutes</li><li>A severe allergic reaction</li><li>Serious burns, head injury with confusion, or poisoning with symptoms</li></ul><p>Stay on the line. The dispatcher can coach you through what to do.</p>`],
  ['CPR for adults',`<p>Use when someone is unresponsive and not breathing normally (gasping doesn't count).</p><ol><li>Call 911 and send someone for an AED (defibrillator).</li><li>Place the person on their back on a firm surface.</li><li>Heel of one hand on the center of the chest, lower half of the breastbone, other hand on top.</li><li>Push hard and fast: at least 2 inches deep, 100 to 120 compressions a minute. Let the chest rise fully between pushes.</li><li>If trained, give 2 rescue breaths after every 30 compressions. If not, keep doing hands-only compressions.</li><li>Turn on the AED as soon as it arrives and follow its voice prompts.</li></ol><p>Don't stop until help takes over or the person starts breathing.</p>`,'cpr'],
  ['Choking',`<p><b>Signs:</b> can't speak, cough or breathe; hands clutching the throat.</p><p>If they can cough forcefully, encourage them to keep coughing.</p><p>If they can't:</p><ol><li>Give 5 firm back blows between the shoulder blades with the heel of your hand.</li><li>Give 5 abdominal thrusts: stand behind, fist just above the navel, other hand over it, pull sharply in and up.</li><li>Repeat until the object comes out or the person becomes unresponsive.</li></ol><p>If they become unresponsive, call 911 and start CPR. For pregnant or very large people, use chest thrusts instead. For infants under 1, use back blows and two-finger chest thrusts, never abdominal thrusts.</p>`,'choke'],
  ['Severe bleeding',`<ol><li>Call 911 for heavy bleeding.</li><li>Press firmly and directly on the wound with a clean cloth or gauze. Keep steady pressure.</li><li>If blood soaks through, add more cloth on top. Don't lift the first layer.</li><li>For life-threatening bleeding from an arm or leg, apply a tourniquet 2 to 3 inches above the wound (not over a joint). Tighten until bleeding stops and note the time.</li><li>Keep the person warm and lying down until help arrives.</li></ol>`,'tourniquet'],
  ['Cuts and scrapes',`<ol><li>Wash your hands, then stop bleeding with gentle pressure.</li><li>Rinse the wound under clean running water. Clean around it with soap.</li><li>Apply a thin layer of antibiotic ointment if available and cover with a bandage.</li><li>Change the dressing daily or when wet or dirty.</li></ol><p><b>See a doctor</b> if the cut is deep or gaping, won't stop bleeding after 10 minutes of pressure, was caused by an animal or a rusty or dirty object, or shows infection: spreading redness, warmth, pus, red streaks or fever. Ask whether you need a tetanus shot.</p>`],
  ['Burns',`<ol><li>Cool the burn under cool (not icy) running water for about 20 minutes.</li><li>Remove rings, watches and tight items before swelling starts.</li><li>Cover loosely with a clean, non-stick dressing or plastic wrap.</li><li>Don't use ice, butter, oils or toothpaste. Don't pop blisters.</li></ol><p><b>Get medical care</b> for burns larger than the person's palm; burns on the face, hands, feet, groin or joints; deep burns that look white, leathery or charred; chemical or electrical burns; or any burn on a young child or older adult.</p>`],
  ['Fever',`<p>Normal body temperature is about 98.6°F (37°C). A fever is 100.4°F (38°C) or higher.</p><p><b>Care:</b> rest, plenty of fluids, light clothing. Over-the-counter fever reducers can help; follow the label exactly. Don't give aspirin to children or teens.</p><p><b>Call a doctor if:</b></p><ul><li>An infant under 3 months has any fever of 100.4°F or more</li><li>An adult's fever is 103°F (39.4°C) or higher, or lasts more than 3 days</li><li>Fever comes with a stiff neck, severe headache, confusion, rash, trouble breathing, chest pain or seizures</li></ul>`],
  ['Cold, flu or COVID?',`<table><tr><th>Symptom</th><th>Cold</th><th>Flu</th><th>COVID-19</th></tr><tr><td>Onset</td><td>Gradual</td><td>Sudden</td><td>Varies</td></tr><tr><td>Fever</td><td>Rare</td><td>Common</td><td>Common</td></tr><tr><td>Body aches</td><td>Mild</td><td>Strong</td><td>Common</td></tr><tr><td>Runny nose</td><td>Common</td><td>Sometimes</td><td>Sometimes</td></tr><tr><td>Loss of taste or smell</td><td>Rare</td><td>Rare</td><td>Sometimes</td></tr><tr><td>Exhaustion</td><td>Mild</td><td>Strong</td><td>Common</td></tr></table><p>A home test can tell flu and COVID apart. Rest, drink fluids and stay home while sick. Seek care for trouble breathing, chest pain, confusion, inability to keep fluids down, or if you're at higher risk (older adults, pregnancy, chronic illness). Antiviral medicines work best when started early, so call a doctor soon if you're high-risk.</p>`],
  ['Dehydration',`<p><b>Signs:</b> thirst, dry mouth, dark yellow urine or urinating less, headache, dizziness, tiredness.</p><p><b>Severe signs:</b> confusion, fainting, a racing heartbeat, no urine for 8 hours or more, sunken eyes. In babies: no wet diaper for 3 hours, no tears, a sunken soft spot.</p><p><b>Care:</b> take small, frequent sips of water or an oral rehydration solution. Avoid alcohol. Get medical help for severe signs, or if vomiting or diarrhea keeps you from holding down fluids.</p>`],
  ['Sprains and strains',`<p>Use <b>R.I.C.E.</b> for the first 48 hours:</p><ul><li><b>Rest:</b> avoid putting weight on it.</li><li><b>Ice:</b> 15 to 20 minutes every 2 to 3 hours, wrapped in a cloth, never directly on skin.</li><li><b>Compression:</b> a snug (not tight) elastic bandage.</li><li><b>Elevation:</b> raise it above heart level.</li></ul><p><b>See a doctor</b> if you can't bear weight, the joint looks deformed, there's numbness or a cold, pale limb, or it isn't improving after a week.</p>`],
  ['Allergic reactions',`<p><b>Mild:</b> sneezing, itchy eyes, a few hives. An over-the-counter antihistamine may help; follow the label.</p><p><b>Severe (anaphylaxis) is an emergency:</b> swelling of the lips, tongue or throat, trouble breathing or swallowing, wheezing, widespread hives, vomiting, dizziness or fainting.</p><ol><li>If the person has an epinephrine auto-injector, use it in the outer thigh right away, following the device instructions.</li><li>Call 911, even if they feel better.</li><li>Have them lie down with legs raised (or sit up if breathing is hard).</li><li>If symptoms don't improve, a second dose may be given per the device instructions.</li></ol>`],
  ['Stroke: BE FAST',`<table><tr><td><b>B</b>alance</td><td>Sudden loss of balance or coordination</td></tr><tr><td><b>E</b>yes</td><td>Sudden vision loss or double vision</td></tr><tr><td><b>F</b>ace</td><td>One side of the face droops when smiling</td></tr><tr><td><b>A</b>rm</td><td>One arm drifts down when both are raised</td></tr><tr><td><b>S</b>peech</td><td>Slurred, strange or hard to understand</td></tr><tr><td><b>T</b>ime</td><td>Call 911 now and note when symptoms began</td></tr></table><p>Every minute matters. Don't drive the person yourself, and don't give them food, drink or medicine.</p>`],
  ['Heart attack',`<p><b>Common signs:</b> chest pressure, squeezing or pain lasting more than a few minutes; pain spreading to an arm, the back, neck or jaw; shortness of breath; cold sweat; nausea; lightheadedness. Women, older adults and people with diabetes more often have shortness of breath, nausea, back or jaw pain, or unusual tiredness.</p><ol><li>Call 911 immediately. Don't drive yourself.</li><li>Sit down and rest.</li><li>Ask the dispatcher whether to chew an aspirin. Don't take it if you're allergic or have been told to avoid it.</li><li>If the person becomes unresponsive, start CPR.</li></ol>`],
  ['Heat illness',`<p><b>Heat exhaustion:</b> heavy sweating; cool, pale, clammy skin; weakness; headache; nausea; dizziness. Move to a cool place, loosen clothing, sip water, apply cool wet cloths. Get help if symptoms worsen or last over an hour.</p><p><b>Heat stroke is an emergency:</b> body temperature 103°F or higher; hot, red skin; confusion; fainting; a rapid pulse. Call 911 and cool the person fast: cool water, wet cloths, ice packs at the neck, armpits and groin. Don't give fluids if they're confused.</p>`],
  ['Cold injuries',`<p><b>Hypothermia:</b> shivering, confusion, slurred speech, drowsiness, clumsy hands. Call 911 for severe signs. Move the person somewhere warm, remove wet clothing, and warm the body's center first with blankets and skin-to-skin contact. Give warm, sweet drinks only if fully alert. Handle them gently.</p><p><b>Frostbite:</b> numb, white or grayish-yellow, firm or waxy skin. Don't rub it. Rewarm in warm (not hot) water only if it won't refreeze. Seek medical care.</p>`],
  ['Head injury and concussion',`<p><b>Signs of concussion:</b> headache, confusion, dizziness, nausea, sensitivity to light or noise, memory gaps, feeling foggy.</p><p><b>Go to the ER or call 911 for:</b> loss of consciousness, a headache that gets worse, repeated vomiting, seizures, one pupil larger than the other, slurred speech, weakness or numbness, unusual drowsiness, or clear fluid from the nose or ears.</p><p>Otherwise, rest your body and brain, limit screens, and return to activity gradually. Avoid sports until a doctor clears you.</p>`],
  ['Recovery position',`<p>For someone unresponsive who is breathing normally, and not suspected of a spine injury:</p><ol><li>Kneel beside them. Place the arm nearest you at a right angle.</li><li>Bring the far arm across the chest, with the back of the hand against the near cheek.</li><li>Bend the far knee up, then roll them toward you onto their side.</li><li>Tilt the head back slightly to keep the airway open.</li><li>Call 911 and keep checking their breathing.</li></ol>`,'recovery'],
  ['Poisoning',`<p>Call <b>Poison Control at 1-800-222-1222</b> (US) for advice, even if there are no symptoms yet. Call 911 if the person is unresponsive, having trouble breathing, or seizing.</p><ul><li>Don't make the person vomit unless told to.</li><li>Have the container or label ready.</li><li>For chemicals on skin, rinse with running water for 15 to 20 minutes. For eyes, rinse with lukewarm water for 15 minutes.</li><li>For fumes, move to fresh air.</li></ul>`],
  ['Home first-aid kit',`<ul><li>Adhesive bandages in several sizes</li><li>Sterile gauze pads, roller gauze and medical tape</li><li>Elastic bandage</li><li>Antiseptic wipes and antibiotic ointment</li><li>Tweezers, scissors, safety pins</li><li>Disposable gloves</li><li>Digital thermometer</li><li>Instant cold packs</li><li>Pain and fever reducers, antihistamines</li><li>Hydrocortisone cream</li><li>Any prescribed emergency medicines (like an epinephrine auto-injector)</li><li>Emergency phone numbers and a first-aid guide</li></ul><p>Check expiration dates twice a year.</p>`]
 ]},
 mechanics:{title:'Car Care & Repair Manual',color:'#2a4664',sub:'Tires, oil, batteries and more',
  intro:WARN('<b>Safety first:</b> park on level ground, set the parking brake and turn on your hazard lights. Never get under a vehicle held up only by a jack; use jack stands or ramps. Always check your owner\u2019s manual for your car\u2019s exact specs.'),
  topics:[
  ['Changing a flat tire',`<p><b>You need:</b> spare tire, jack, lug wrench, wheel wedges (or rocks), owner's manual.</p><ol><li>Pull well off the road, hazards on, parking brake set. Wedge the wheel diagonally opposite the flat.</li><li>Remove the hubcap if needed. Loosen each lug nut about half a turn while the tire is still on the ground (counterclockwise).</li><li>Place the jack at the frame lift point shown in your manual. Raise the car until the flat is about 6 inches off the ground.</li><li>Remove the lug nuts and pull the tire straight off.</li><li>Mount the spare, lining up the holes. Hand-tighten the lug nuts.</li><li>Lower the car until the tire touches the ground, then tighten the nuts in a star pattern.</li><li>Lower fully, remove the jack, and give each nut a final firm tightening in the same pattern.</li><li>Check the spare's pressure soon. Small "donut" spares are usually limited to about 50 mph and a short distance; see your manual.</li></ol>`,'lugs'],
  ['Checking tire pressure',`<ol><li>Check when tires are cold (before driving, or after 3 hours parked).</li><li>Find the correct pressure on the sticker inside the driver's door jamb or in the manual. Don't use the "max pressure" on the tire sidewall.</li><li>Remove the valve cap, press the gauge on firmly, and read it.</li><li>Add air in short bursts and recheck, or let air out by pressing the valve pin.</li><li>Replace the caps. Don't forget the spare.</li></ol><p>Check monthly and before long trips. Low pressure wears tires faster and wastes fuel.</p>`],
  ['Tread depth: the penny test',`<p>Tires need enough tread to grip wet roads. US legal minimum in most states is 2/32 inch.</p><ol><li>Put a penny into a tread groove with Lincoln's head upside down and facing you.</li><li>If you can see the top of his head, tread is below 2/32 inch. Replace the tire.</li><li>Check several spots across each tire. Uneven wear can mean bad alignment or wrong pressure.</li></ol><p>Many tires also have small raised wear bars in the grooves. When the tread is flush with them, it's time.</p>`,'penny'],
  ['Rotating tires',`<p>Rotating spreads wear evenly so tires last longer. Most cars need it every 5,000 to 7,500 miles; check your manual.</p><ol><li>Loosen the lug nuts slightly on all wheels.</li><li>Raise the car safely and support it on jack stands at all four corners.</li><li>Move each tire to its new position following the pattern for your drive type.</li><li>Tighten in a star pattern, lower, then torque to spec.</li></ol><p>Directional tires (arrows on the sidewall) only move front to back on the same side.</p>`,'rotate'],
  ['Changing engine oil',`<p><b>You need:</b> the right oil (type and amount in your manual), a new oil filter, a wrench for the drain plug, an oil filter wrench, a drain pan, a funnel, gloves, rags, and ramps or jack stands.</p><ol><li>Run the engine 2 minutes to warm the oil, then turn it off. Let it cool enough to touch safely.</li><li>Raise the car safely on ramps or jack stands. Set the parking brake.</li><li>Place the drain pan under the drain plug. Loosen the plug (counterclockwise) and let the oil drain fully.</li><li>Clean the plug, fit a new washer if required, and reinstall it snugly. Don't overtighten.</li><li>Move the pan under the filter and unscrew it. Some oil will spill.</li><li>Rub a little fresh oil on the new filter's rubber gasket. Screw it on by hand until the gasket touches, then about 3/4 turn more.</li><li>Lower the car. Open the oil cap on top of the engine and pour in the new oil with a funnel, slightly less than the full amount.</li><li>Wait a minute, check the dipstick, and top up to the full mark.</li><li>Start the engine for 30 seconds, check for leaks, turn off, recheck the level.</li><li>Take old oil and the filter to an auto parts store or recycling center. Never pour it on the ground or down a drain.</li></ol>`],
  ['Checking oil and fluids',`<p><b>Engine oil:</b> on level ground with the engine off for a few minutes, pull the dipstick, wipe it, reinsert fully, pull it again and read the level between the marks.</p><p><b>Coolant:</b> check the see-through overflow tank level when the engine is cold. <b>Never open a hot radiator cap.</b></p><p><b>Brake fluid:</b> should be between MIN and MAX in its reservoir. A falling level can mean worn pads or a leak; get it checked.</p><p><b>Washer fluid:</b> top up with washer fluid, not plain water in freezing weather.</p><p><b>Transmission and power steering:</b> procedures vary by car; follow your manual.</p>`,'dipstick'],
  ['Jump-starting a battery',`<ol><li>Park the good car close, both cars off, parking brakes on.</li><li>Connect in this order:<br>1. Red clamp to the dead battery's + terminal.<br>2. Other red clamp to the good battery's +.<br>3. Black clamp to the good battery's \u2212.<br>4. Last black clamp to bare, unpainted metal on the dead car's engine, away from the battery.</li><li>Start the good car and let it run a few minutes.</li><li>Try starting the dead car. If it doesn't start, wait a few minutes and try again.</li><li>Remove the clamps in reverse order. Drive at least 20 minutes to recharge.</li></ol><p>Don't jump a cracked, leaking or frozen battery. Keep clamps from touching each other.</p>`,'jumper'],
  ['Replacing wiper blades',`<ol><li>Check your manual or the store's guide for the right blade length for each side.</li><li>Lift the wiper arm away from the glass. Lay a towel on the windshield in case the arm snaps back.</li><li>Press the small release tab where the blade meets the arm and slide the old blade off.</li><li>Slide the new blade on until it clicks.</li><li>Lower the arm gently and test.</li></ol><p>Replace blades every 6 to 12 months, or when they streak, skip or squeak.</p>`],
  ['Replacing the engine air filter',`<ol><li>Open the hood and find the air filter box, usually a black plastic box connected to a large intake hose.</li><li>Undo the clips or screws and lift the cover.</li><li>Remove the old filter and note which way it sat.</li><li>Wipe out any debris and drop in the new filter the same way.</li><li>Close and secure the cover.</li></ol><p>Typical interval: every 15,000 to 30,000 miles, sooner in dusty areas.</p>`],
  ['Dashboard warning lights',`<table><tr><td><b>Oil pressure</b> (oil can)</td><td>Stop safely and turn off the engine now. Check the oil level.</td></tr><tr><td><b>Temperature</b> (thermometer)</td><td>Engine overheating. Pull over and let it cool.</td></tr><tr><td><b>Battery</b></td><td>Charging problem. Drive to a shop soon; the car may stall.</td></tr><tr><td><b>Brake</b></td><td>Parking brake on, or low brake fluid. Get it checked.</td></tr><tr><td><b>Check engine</b></td><td>Steady: get it scanned soon. Flashing: serious misfire, reduce speed and get help.</td></tr><tr><td><b>Tire pressure</b> (horseshoe with !)</td><td>One or more tires low. Check pressures.</td></tr><tr><td><b>ABS</b></td><td>Anti-lock brakes off. Normal brakes still work; get it checked.</td></tr></table>`],
  ['Replacing a headlight bulb',`<ol><li>Find the bulb type in your manual.</li><li>Open the hood and reach behind the headlight housing. Twist the bulb holder counterclockwise or unclip the connector.</li><li>Remove the old bulb. Don't touch the glass of the new halogen bulb with bare fingers; skin oils shorten its life.</li><li>Insert the new bulb, reconnect, twist back in.</li><li>Test both low and high beams.</li></ol><p>Replace bulbs in pairs for even brightness. Some cars require removing other parts; your manual will say.</p>`],
  ['Brake warning signs',`<ul><li>High-pitched squeal when braking: wear indicators say pads are low.</li><li>Grinding: pads may be gone, metal on metal. Stop driving and get help.</li><li>Soft or spongy pedal, or it sinks to the floor: possible fluid leak or air in the lines.</li><li>Car pulls to one side when braking.</li><li>Vibration in the pedal or steering wheel: warped rotors.</li></ul><p>Brakes are a safety system. Have any of these inspected promptly.</p>`],
  ['If your engine overheats',`<ol><li>Turn off the A/C and turn the heater to full hot to pull heat from the engine.</li><li>Pull over safely and turn off the engine.</li><li>Open the hood only if no steam is pouring out, and let it cool at least 30 minutes.</li><li>Never open the radiator cap while hot. Check the overflow tank when cool and add coolant if low.</li><li>Look for leaks or a broken belt. If the gauge climbs again, call for a tow.</li></ol>`],
  ['Roadside emergency kit',`<ul><li>Jumper cables or a portable jump starter</li><li>Tire pressure gauge and a portable air compressor</li><li>Flashlight with spare batteries</li><li>Reflective triangles or flares</li><li>First-aid kit</li><li>Water, snacks, blanket</li><li>Basic tools: screwdrivers, pliers, adjustable wrench, duct tape</li><li>Gloves, rags, a quart of oil and a jug of coolant</li><li>Phone charger</li><li>In winter: ice scraper, small shovel, sand or kitty litter for traction</li></ul>`]
 ]},
 survival:{title:'End of the World Survival Guide',color:'#3a5f22',sub:'Water, shelter, fire, food and rescue',
  intro:WARN('Prepare before you need it. In a real emergency, follow official alerts from local authorities, FEMA (ready.gov) and the National Weather Service.'),
  topics:[
  ['The rule of threes',`<p>You can generally survive about:</p><ul><li><b>3 minutes</b> without air</li><li><b>3 hours</b> without shelter in harsh weather</li><li><b>3 days</b> without water</li><li><b>3 weeks</b> without food</li></ul><p>So set priorities in this order: get safe from immediate danger, protect yourself from the elements, find water, make fire, then signal for help and find food. Stay calm; panic wastes energy and leads to bad choices.</p>`],
  ['Emergency go-bag',`<p>Pack enough for at least 72 hours per person:</p><ul><li>Water: 1 gallon per person per day</li><li>Non-perishable food and a manual can opener</li><li>Battery or hand-crank radio (NOAA weather radio)</li><li>Flashlight, extra batteries, phone power bank</li><li>First-aid kit and a week of prescription medicines</li><li>Whistle, dust masks, plastic sheeting and duct tape</li><li>Wrench or pliers to turn off utilities</li><li>Copies of IDs, insurance and contacts in a waterproof bag</li><li>Cash in small bills</li><li>Change of clothes, sturdy shoes, rain gear, emergency blanket</li><li>Local paper maps</li><li>Hygiene items, garbage bags</li></ul><p>Check it every 6 months and swap out expired items.</p>`],
  ['Finding water',`<ul><li>Collect rainwater with tarps, ponchos or containers.</li><li>Flowing streams are better than still ponds, but all natural water must be purified.</li><li>Collect morning dew by wiping grass with a cloth and wringing it out.</li><li>At home: your water heater tank, ice cubes and the toilet tank (not the bowl) hold usable water if not chemically treated.</li><li>A solar still slowly pulls water from damp ground or green plants.</li></ul><p>Never drink seawater or urine; they dehydrate you faster.</p>`,'still'],
  ['Purifying water',`<p>If water is cloudy, let it settle and strain it through a clean cloth first.</p><p><b>Boiling (best):</b> bring to a rolling boil for 1 minute (3 minutes above 6,500 feet). Let it cool.</p><p><b>Household bleach:</b> use only plain, unscented bleach. For 6% bleach, add 8 drops per gallon. For 8.25% bleach, add 6 drops per gallon. Stir and wait 30 minutes. It should smell faintly of chlorine; if not, repeat once and wait 15 more minutes.</p><p><b>Filters and tablets:</b> follow the product directions. Filters remove bacteria and parasites; most don't remove viruses unless labeled.</p><p>Store purified water in clean, covered containers.</p>`],
  ['Building a shelter',`<ul><li>Pick a spot that's dry, out of the wind, away from dead trees, flood paths and rockfall.</li><li>A lean-to is quick: lash a ridge pole between two trees, lean branches against it, then layer leaves, boughs or a tarp.</li><li>Keep it small; small shelters hold body heat.</li><li>Insulate yourself from the ground with a thick layer of leaves, pine needles or packs. The ground pulls heat away fast.</li><li>Face the open side away from the wind.</li></ul>`,'leanto'],
  ['Making fire',`<p>Fire needs three things: heat, fuel and air. Remove any one and it goes out.</p><ol><li>Clear a spot down to bare soil, away from overhanging branches. Ring it with rocks if you can.</li><li>Gather <b>tinder</b> (dry grass, bark shavings, cotton, paper), <b>kindling</b> (pencil-thin sticks) and <b>fuel</b> (wrist-thick and larger).</li><li>Build a teepee of kindling around a tinder bundle, leaving a gap to light it.</li><li>Light the tinder from the windward side. Blow gently at the base.</li><li>Add bigger pieces gradually.</li></ol><p>Carry two or three ways to light a fire: lighter, waterproof matches, a ferrocerium rod. Never leave a fire unattended, and drown it completely before leaving.</p>`,'fire'],
  ['Food',`<ul><li>Stock canned goods, rice, beans, oats, peanut butter and dried fruit. Rotate stock: eat the oldest first.</li><li>Don't eat wild plants or mushrooms unless you're certain what they are. Many deadly ones look like safe ones.</li><li>Fish and small game are more reliable calorie sources than plants.</li><li>Cook all meat and fish thoroughly.</li><li>In a power outage, a closed fridge keeps food cold about 4 hours; a full freezer about 48 hours. When in doubt, throw it out.</li><li>Ration food, not water. Drink enough water first.</li></ul>`],
  ['Finding your way',`<ul><li>The sun rises roughly in the east and sets in the west.</li><li><b>Shadow stick:</b> put a stick upright in the ground. Mark the tip of its shadow. Wait 15 minutes and mark again. A line from the first mark to the second points roughly west to east.</li><li><b>North Star:</b> in the Northern Hemisphere, follow the two stars at the end of the Big Dipper's cup up to Polaris, which sits almost exactly north.</li><li>If lost, stay put unless you must move. Rescuers search your last known location first.</li><li>Follow water downstream; it often leads to people.</li></ul>`,'shadow'],
  ['Night sky navigation',`<p>Polaris, the North Star, barely moves during the night. Face it and you face north; east is to your right.</p><p>In the Southern Hemisphere, find the Southern Cross. Extend the long axis of the cross about four and a half times its length to find the point roughly due south.</p>`,'dipper'],
  ['Signaling for rescue',`<ul><li><b>Three of anything</b> means distress: three fires in a triangle, three whistle blasts, three flashes.</li><li><b>SOS</b> in Morse code: \u2022 \u2022 \u2022 \u2014 \u2014 \u2014 \u2022 \u2022 \u2022 (3 short, 3 long, 3 short).</li><li>A mirror or shiny object can flash sunlight to aircraft miles away.</li><li>Bright clothing, tarps and smoke stand out. Green leaves on a fire make white smoke by day.</li><li>Ground signals, big enough to see from the air: <b>V</b> means need help, <b>X</b> means need medical help, an <b>arrow</b> shows the direction you went.</li></ul>`],
  ['Staying warm and dry',`<ul><li>Dress in layers: a base layer that wicks sweat, an insulating layer (wool or fleece), and a wind- and waterproof shell.</li><li>Avoid cotton in cold or wet weather; it stays wet and pulls heat from your body.</li><li>Cover your head, hands and neck.</li><li>Change out of wet clothes as soon as you can.</li><li>Eat and drink regularly; your body needs fuel to make heat.</li><li>Share body heat with others in a shelter.</li></ul>`],
  ['Power outages',`<ul><li>Use flashlights, not candles, to avoid fires.</li><li>Run generators <b>outdoors only</b>, at least 20 feet from windows and doors. Carbon monoxide is invisible and deadly. Install battery-powered CO alarms.</li><li>Never use a grill, camp stove or generator indoors or in a garage.</li><li>Unplug electronics to protect them from surges when power returns.</li><li>Keep fridge and freezer doors closed.</li><li>If you smell gas, leave immediately and call the gas company from outside.</li></ul>`],
  ['Sanitation and hygiene',`<ul><li>Wash hands with soap and clean water, especially before eating and after using the toilet.</li><li>Dig latrines at least 200 feet from water sources and camp, 6 to 8 inches deep. Cover waste with soil.</li><li>A bucket lined with a heavy trash bag works as an emergency toilet. Add a little bleach or kitty litter.</li><li>Keep cuts clean and covered to prevent infection.</li><li>Store garbage away from your shelter to avoid pests.</li></ul>`],
  ['Staying strong together',`<ul><li>Keep a daily routine: meals, chores, sleep, watches.</li><li>Share tasks by skill. Someone tends fire, someone gathers water, someone keeps watch.</li><li>Make decisions together and keep spirits up with stories, games and small wins.</li><li>Check on the most vulnerable: children, older people, the sick.</li><li>Rest when you can. Exhaustion leads to injuries and mistakes.</li></ul><p>Most disasters are survived by people who help each other.</p>`]
 ]},

function sx_swap(ctx){const p=sx;sx=ctx;return p;}
const COVER_FRAMES=8;let coverFrames=[],coverAnim=0,coverHideT=0;
function coverSize(){const dpr=Math.min(2,window.devicePixelRatio||1);return[Math.round(innerWidth*dpr),Math.round(innerHeight*dpr)];}
function buildCoverFrame(k){const[W,H]=coverSize();try{coverFrames[k]=coverCanvas(W,H,'splash',k/COVER_FRAMES);}catch(e){noteErr('cover: '+e);}}
function showCover(){const cv=$('coverCv'),[W,H]=coverSize();cv.width=W;cv.height=H;coverFrames=[];buildCoverFrame(0);if(coverFrames[0])cv.getContext('2d').drawImage(coverFrames[0],0,0);}
function startCover(){
 const el=$('cover'),cv=$('coverCv');el.style.display='';el.classList.remove('hide');
 const bar=$('coverBarFill');bar.style.transition='none';bar.style.width='0%';
 const fontP=document.fonts&&document.fonts.load?Promise.race([document.fonts.load('40px VT323'),new Promise(r=>setTimeout(r,600))]):Promise.resolve();
 fontP.then(()=>{
  showCover();requestAnimationFrame(()=>{bar.style.transition='width 2s linear';bar.style.width='100%';});
  let k=1;const fill=()=>{if(el.classList.contains('hide'))return;if(k<COVER_FRAMES){buildCoverFrame(k++);requestAnimationFrame(fill);}};requestAnimationFrame(fill);
  let fi=0;clearInterval(coverAnim);coverAnim=setInterval(()=>{const fr=coverFrames[fi%COVER_FRAMES]||coverFrames[0];if(fr)cv.getContext('2d').drawImage(fr,0,0);fi++;},125);
  clearTimeout(coverHideT);coverHideT=setTimeout(hideCover,2000);
 });
}
function hideCover(){const el=$('cover');if(el.classList.contains('hide'))return;clearTimeout(coverHideT);el.classList.add('hide');setTimeout(()=>{el.style.display='none';clearInterval(coverAnim);coverFrames=[];},550);}
function initCover(){
 const el=$('cover');el.addEventListener('click',hideCover);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')hideCover();});
 startCover();
}

/* ---------- Menu: help, controls, sound ---------- */
const HELP={
 controls:['Controls',`<dl>
<dt>Coin buttons</dt><dd>Copper +1, Silver +5, Gold +20 and Pouch +50 stack coins on the tray to set the price you want to pay or ask.</dd>
<dt>Coin tray</dt><dd>Tap it to clear your coins and start over.</dd>
<dt>Haggle</dt><dd>Offer the coins on your tray. The customer accepts, counters, or loses patience. With the tax collector this button says <b>Bribe</b>.</dd>
<dt>Accept</dt><dd>Take the customer's current price. For orders it takes the order; for beggars it gives alms.</dd>
<dt>Refuse</dt><dd>Send the customer away.</dd>
<dt>Flatter</dt><dd>One compliment per customer. It can raise what they'll pay (or lower what they'll take) and add patience, or annoy them.</dd>
<dt>One moment, please</dt><dd>Asks a waiting customer for more time.</dd>
<dt>Bite coin</dt><dd>Test a buyer's money. Exposes counterfeits, but offends honest customers.</dd>
<dt>Wanted posters</dt><dd>Tap a poster to see the crook. If they're at your window, tap <b>Call the guard</b>.</dd>
<dt>Grab his wrist!</dt><dd>When a thief strikes, tap the jumping button the number of times shown before the bar runs out.</dd>
<dt>Pause</dt><dd>The pause button in the header freezes the shop while it's open.</dd>
<dt>Patience pips</dt><dd>The red squares in the window show how much patience the customer has left.</dd>
</dl>`],
 mech:['How the game works',`<h4>A day in the shop</h4><p>Each morning, check the news and weather, dig at the scrap yard, and restock in Town. Open the shutters to serve customers. When the last one leaves, tally the day: tax, rent and other bills are paid at night.</p>
<h4>Haggling</h4><p>Every customer has a hidden limit. Buyers won't pay above theirs; sellers won't go below theirs. Ask too much (or offer too little) and they get insulted and lose more patience. When patience runs out, they leave.</p>
<h4>Display table</h4><p>Pick up to three goods for the table under your wanted posters. Tap the table, or use the Stock tab. The bookshelf beside it holds your reference books; tap one to read it. Customers notice them, ask for them more often and pay about 10% more.</p>
<h4>Reputation</h4><p>Fair prices, delivered orders and caught crooks raise it. Gouging, insults and missed orders lower it. Higher reputation means more patient customers who pay more.</p>
<h4>Thieves, fakes and wanted posters</h4><p>Thieves try to grab your purse. Guards and defenses help. Some buyers pay with fake coins, discovered at night. Known crooks on wanted posters can be turned in for a reward.</p>
<h4>Special visitors</h4><p>Doctors sell cures when you're feverish. Beggars ask for alms. The tax collector takes a tenth of the day's sales. Heralds bring orders from the authorities.</p>
<h4>Orders and bounties</h4><p>Special orders ask for goods by a deadline; deliver them from the Ledger. The bounty board posts two daily goals with coin rewards.</p>
<h4>Bills and debt</h4><p>Bills come due every night. Fall more than 100g into debt and the town takes your shop. The moneylender in Town lends 200g, to be repaid as 250g within 5 days.</p>
<h4>Spoilage</h4><p>Bread, cheese, herbs, fish and apples spoil overnight, and rats nibble food unless you own a shop cat.</p>
<h4>Seasons, weather and ages</h4><p>Seasons change every 7 days and shift prices. Weather changes the number of customers and thieves. Every 10 days the town moves into a new age, from Medieval to the Neon Age, and goods change with it.</p>
<h4>Scrap yard</h4><p>Open only while your shop is closed. Rub away dirt, then unscrew, unplug or pry the part loose. A perfect job doubles the find; a botched one destroys it and may injure you. It gets easier as you level up.</p>
<h4>Forge and defenses</h4><p>Buy the forge in the Work tab to smelt scrap and make goods. Recipes come in three tiers: basic goods, parts made from other parts, and masterworks. Masterworks need the Master Forge, several forge uses and many materials, but sell for thousands, up to 999,999g for the airship. A rich collector visits when you own one. Mount weapons and build window bars or a gear trap to protect the shop.</p>
<h4>Levels and talents</h4><p>Trading, salvaging, forging and catching crooks earn XP. Each level lets you choose a talent.</p>
<h4>Exchange and trophies</h4><p>The Exchange ranks shops by net worth: your coin plus your stock at market price. Trophies are listed in the Ledger.</p>`],

};
let RBM={};
function slotNameModal(title,cur,onOk){modal('<h2>'+title+'</h2><label>Save name<input class="field" id="slotIn" maxlength="40" value="'+esc(cur||'')+'" placeholder="Leave blank to use the date, time and age"></label>',[{l:'Cancel',f:()=>openMenu()},{l:'Save',c:'green',f:()=>{onOk((($('slotIn')||{}).value||'').trim());}}]);setTimeout(()=>{const i=$('slotIn');if(i)i.focus();},60);}
function openMenu(){if(thiefTimer){toast('Deal with the thief first!');return;}$('menuOv').classList.add('on');renderMenu();}
function closeMenu(){$('menuOv').classList.remove('on');}
function renderMenu(){
 const sv=Math.round((S.sfxVol!=null?S.sfxVol:1)*100),mv=Math.round((S.musicVol!=null?S.musicVol:.7)*100);
 let h='<div class="mnu"><details class="tocg" open><summary><span class="gname">Sound</span></summary><div style="padding:4px 12px 10px;background:#f8eed4">'+
  '<div class="mrow"><label for="mSfx">Sound effects</label><input type="range" id="mSfx" min="0" max="100" value="'+sv+'"><output id="oSfx">'+sv+'%</output></div>'+
  '<div class="mrow"><label for="mMus">Music</label><input type="range" id="mMus" min="0" max="100" value="'+mv+'"><output id="oMus">'+mv+'%</output></div>'+
  '<div class="mrow"><label>All sound is '+(muted?'<b>muted</b>':'<b>on</b>')+'</label><button class="mbtn2'+(muted?' danger':'')+'" data-m="mute">'+(muted?'Unmute':'Mute all')+'</button></div><div class="mrow"><label>Music is '+(S.music?'<b>on</b>':'<b>off</b>')+'</label><button class="mbtn2" data-m="music">'+(S.music?'Turn music off':'Turn music on')+'</button></div><div class="mrow"><label>Check your speaker</label><button class="mbtn2" data-m="test">Play a test sound</button></div>'+
  '<p class="mk" style="margin:6px 0 0;color:#6a4a2a">On iPhone and iPad, the ringer switch can silence the game.</p></div></details>';
 Object.entries(HELP).forEach(([k,[t,body]])=>{h+='<details class="tocg"><summary><span class="gname">'+t+'</span></summary><div style="padding:4px 12px 10px;background:#f8eed4">'+body+'</div></details>';});
 h+='<details class="tocg"'+(RBM.saves?' open':'')+' id="mSaves"><summary><span class="gname">Saves</span><span class="gcount">Playing save '+META.active+'</span></summary><div style="padding:6px 12px 10px;background:#f8eed4">'+[1,2,3].map(n=>{const cur=n===META.active,st=cur?S:readSlot(n),nm=META.names[n];
   if(!st)return '<div class="slotcard"><div class="slotinfo"><b>Save '+n+': empty</b><small>No game saved here yet.</small></div><div class="slotbtns"><button class="mbtn2 on" data-m="snew" data-n="'+n+'">New game</button><button class="mbtn2" data-m="scopy" data-n="'+n+'">Copy current game here</button></div></div>';
   const when=META.played[n]?new Date(META.played[n]).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
   return '<div class="slotcard'+(cur?' cur':'')+'"><div class="slotinfo"><b>Save '+n+': '+esc(nm||autoName(st))+'</b><small>Day '+st.day+', '+ERAS[eraOf(st.day)].n+', '+fmtN(st.purse)+'g'+(when?'. Last played '+when:'')+'</small></div><div class="slotbtns">'+(cur?'<span class="slotnow">Playing now</span>':'<button class="mbtn2 on" data-m="sload" data-n="'+n+'">Load</button>')+'<button class="mbtn2" data-m="sren" data-n="'+n+'">Rename</button>'+(cur?'':'<button class="mbtn2 danger" data-m="sdel" data-n="'+n+'">Delete</button>')+'</div></div>';}).join('')+'<p class="mk" style="margin:6px 0 0;color:#6a4a2a">Saves are kept on this device. The Exchange shows whichever save you played last.</p></div></details>';
 h+='<details class="tocg"><summary><span class="gname">Game</span></summary><div style="padding:4px 12px 10px;background:#f8eed4">'+
  '<div class="mrow"><label>Shopkeeper name: <b>'+esc(S.username||'not set')+'</b></label><button class="mbtn2" data-m="name">Change name</button></div>'+
  '<div class="mrow"><label>Found a problem?</label><button class="mbtn2" data-m="bug">Report a bug</button></div>'+
  '<div class="mrow"><label>Screen orientation tip</label><button class="mbtn2" data-m="rot">Show it again</button></div>'+
  '<div class="mrow"><label>Title screen</label><button class="mbtn2" data-m="cover">Show title screen</button></div>'+
  '<div class="mrow"><label>Start over from day 1</label><button class="mbtn2 danger" data-m="reset">Restart game</button></div>'+
  '<p class="mk" style="margin:8px 0 0;color:#6a4a2a">Brighter Days, version '+GAME_VERSION+'.<br>Created by <b>LeverOne Studios</b>.<br>Dictionary definitions from Princeton WordNet 3.0.</p></div></details></div>';
 $('menuPage').innerHTML=h;
 const bind=(id,o,key)=>{const el=$(id);el.addEventListener('input',()=>{S[key]=el.value/100;$(o).textContent=el.value+'%';});el.addEventListener('change',()=>{save();if(key==='sfxVol')sfx('coin');});};
 bind('mSfx','oSfx','sfxVol');bind('mMus','oMus','musicVol');
}
$('menuOv').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;const m=b.dataset.m,n=+b.dataset.n;RBM.saves=1;
 if(m==='sload'){save();META.active=n;saveMeta();toast('Loading save '+n+'...');setTimeout(()=>location.reload(),300);return;}
 if(m==='sren'){closeMenu();const st=n===META.active?S:readSlot(n);slotNameModal('Rename save '+n,META.names[n],v=>{META.names[n]=v||autoName(st);saveMeta();openMenu();});return;}
 if(m==='sdel'){closeMenu();modal('<h2>Delete save '+n+'?</h2><p>\u201c'+esc(META.names[n]||'')+'\u201d will be erased from this device. This can\u2019t be undone.</p>',[{l:'Keep it',f:()=>openMenu()},{l:'Delete',c:'red',f:()=>{try{localStorage.removeItem(slotKey(n));}catch(e){}delete META.names[n];delete META.played[n];saveMeta();openMenu();toast('Save '+n+' deleted.');}}]);return;}
 if(m==='scopy'){save();try{localStorage.setItem(slotKey(n),JSON.stringify(S));}catch(e){}META.names[n]=(META.names[META.active]||autoName(S))+' (copy)';META.played[n]=Date.now();saveMeta();renderMenu();toast('Copied to save '+n+'.');return;}
 if(m==='snew'){closeMenu();slotNameModal('Start a new game in save '+n,'',v=>{save();try{localStorage.removeItem(slotKey(n));}catch(e){}META.names[n]=v||autoName({day:1});META.played[n]=Date.now();META.active=n;saveMeta();toast('Starting a new game...');setTimeout(()=>location.reload(),300);});return;}
 if(m==='mute'){muted=!muted;S.muted=muted;save();renderMenu();if(!muted)sfx('coin');}
 else if(m==='music'){S.music=!S.music;save();if(S.music)tone(1,.01,'sine',.0001);renderMenu();}
 else if(m==='test'){if(muted){toast('Sound is muted.');return;}sfx('deal');}
 else if(m==='name'){closeMenu();signIn(false);}
 else if(m==='bug'){closeMenu();openBug();}
 else if(m==='rot'){try{localStorage.removeItem('bd_portrait_ok');}catch(e){}rotDismissed=false;closeMenu();checkOrient();if(innerHeight<=innerWidth)toast('The tip appears when you hold your device upright.');}
 else if(m==='cover'){closeMenu();startCover();}
 else if(m==='reset'){closeMenu();modal('<h2>Start over?</h2><p>Your shop, stock, coin and trophies will be lost. Your shopkeeper name is kept.</p>',[{l:'Keep playing'},{l:'Restart',c:'red',f:restart}]);}
});
$('menuBtn').addEventListener('click',openMenu);$('menuClose').addEventListener('click',closeMenu);
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('menuOv').classList.contains('on'))closeMenu();});

/* ---------- iPad orientation ---------- */
const IPAD=/iPad/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
let rotDismissed=false;try{rotDismissed=localStorage.getItem('bd_portrait_ok')==='1';}catch(e){}
function checkOrient(){$('rotate').classList.toggle('on',!rotDismissed&&innerHeight>innerWidth);}
$('rotOk').addEventListener('click',()=>{rotDismissed=true;try{localStorage.setItem('bd_portrait_ok','1');}catch(e){}checkOrient();});
addEventListener('resize',checkOrient);addEventListener('orientationchange',()=>setTimeout(checkOrient,250));
try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}
checkOrient();

/* ---------- Boot ---------- */
$('purseIcon').src=pileURL(GOLDP);$('lan1').src=$('lan2').src=sprURL('lantern',LANTERN);
$('cpC').src=pileURL(COPP);$('cpS').src=pileURL(SILVP);$('cpG').src=pileURL(GOLDP);$('cpP').src=sprURL('pouchbig',POUCH);
$('tiShop').src=sprURL('t1',TAB.shop);$('tiStock').src=sprURL('t2',TAB.stock);$('tiTown').src=sprURL('t3',TAB.town);$('tiWork').src=sprURL('t5',TAB.work);$('tiEx').src=sprURL('t6',["k.........","k......nn.","k...nn.nn.","k...nn.nn.","k.r.nn.nn.","k.r.nn.nn.","k.r.nn.nn.","kkkkkkkkkk"]);$('tiLedger').src=sprURL('t4',TAB.ledger);
initCover();
const loaded=load();S=loaded||fresh();CUR_ERA=eraOf(S.day);if(!S.yard)S.yard=makeYard(S);muted=!!S.muted;
if(S.phase==='open'&&S.served>0)S.served--;
if(!S.bounties)S.bounties=makeBounties();
if(!S.posters.length)addPoster('Counterfeiter');
if(S.yard)S.yard.loot.forEach((L,i)=>{if(L.pending)finishDig(i,'ok');});
renderAll();requestAnimationFrame(frame);
if(!loaded){if(META.user&&META.user.username)Object.assign(S,{username:META.user.username,uid:META.user.uid,ticker:META.user.ticker});if(META.prefs){Object.assign(S,META.prefs);muted=!!S.muted;}save();whenCaps(()=>S.username?intro():signIn(true,intro));}
else{if(!S.username)whenCaps(()=>signIn(true));if(S.phase==='open')setTimeout(nextCustomer,600);else if(S.phase==='over')gameOver();}
})();
</script>
</body>
</html>
